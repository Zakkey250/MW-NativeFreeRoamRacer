[VehicleLimit]
Enabled = 1
MaxVehicles = 32

[Audio]
; Optional and restart-gated. 0 keeps the exact experimental.10 audio behavior.
; 1 expands the native mixer arena to 8 MiB and publishes a capability for
; cooperating mods. It does not itself raise any engine-audio slot count.
LBEngineAudioExpansion = 0

[VehicleResources]
; Automatically prepares private native textures in memory; game files stay unchanged.
; Existing Unlimiter skin allocation keeps ownership to avoid competing patches.
AdditionalSkins = 1
; Restart required. Native car-part eModel capacity, independent of skin count.
; 4096 reserves only 72 KiB more than stock 1024. 0 leaves the existing owner alone.
PartModelSlots = 4096

[Diagnostics]
Logging = 0
MonitorIntervalMs = 100
