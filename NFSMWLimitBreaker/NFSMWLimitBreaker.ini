[VehicleLimit]
Enabled = 1
MaxVehicles = 32

[Audio]
; Optional and restart-gated. 0 keeps the exact experimental.10 audio behavior.
; 1 expands the native mixer arena to 8 MiB and publishes a capability for
; cooperating mods. It does not itself raise any engine-audio slot count.
LBEngineAudioExpansion = 0

[VehicleResources]
; Automatically prepares private native textures in memory; game files stay unchanged.
; Existing Unlimiter skin allocation keeps ownership to avoid competing patches.
AdditionalSkins = 1
; Restart required. Native car-part eModel capacity, independent of skin count.
; 8192 reserves 168 KiB more than stock 1024. 0 leaves the existing owner alone.
PartModelSlots = 8192
; On LAA executables, extend the native 115 MiB Unlimiter car arena.
; Restart required. Set 0 to keep the existing arena size.
RpdStreamingHeadroom = 1
; RPD car arena. Validated in stages at 224 and 256 MiB. 160 restores the older budget.
; Accepted: 160, 192, 224 or 256 MiB. Other values fall back to 160. Restart required.
RpdStreamingPoolMiB = 256

[Diagnostics]
Logging = 0
MonitorIntervalMs = 100
