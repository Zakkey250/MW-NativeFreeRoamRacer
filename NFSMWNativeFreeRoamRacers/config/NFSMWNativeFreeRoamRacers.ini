; Restart after editing. / 変更後はゲームを再起動してください。
; Defaults match the accepted installed settings (2026-09-14).
; 配布既定値は2026-09-14時点の実機設定です。

[Encounter]
; 0 disables encounters only. / 0はバトルのみ無効化。
SignalEnabled = 1
; Optional: Language = en (Japanese when omitted). / 省略時は日本語。
; Trailing AI drive-output multipliers (not speed), range 1.00..2.00.
; 後続AIの駆動出力倍率。速度倍率ではありません。範囲1.00～2.00。
PowerScale0To100 = 1.50
PowerScale100To200 = 1.75
PowerScale200To300 = 2.00

[Audio]
; Native free-roam audio slots: 0..4. / 音声枠0～4。音声プール自体は拡張しません。
FreeRoamSlots = 4

[Population]
Enabled = 1
; 1..15 cars; resource/traffic availability may limit actual count.
; 1～15台。資源・アンカーの状況により実数は減ります。
MaximumRacers = 6
; Metres from player, 100..1000. / 自車からの距離、100～1000m。
RadiusMeters = 600

[Markers]
; Metres, 25..Population radius. / 25m～生成範囲。
RadiusMeters = 200

[Vehicles]
; 1..5 model types INCLUDING the player. Separate from vehicle count.
; 自車を含む1～5車種。台数とは別。価格・性能の近い車種を選別。
Variety = 5
; Paint/body/hood/spoiler; invalid parts retry, then fall back to stock.
; 塗装・ボディ・フード・スポイラー。不正時は再抽選後に純正へ。ホイールは純正。
RandomAppearance = 1
AppearanceAttempts = 3

[Spawning]
; Traffic supplies spawn anchors only; opponents use racer AI.
; アザーカーは生成位置の基準のみ。相手はレーサーAIで走行。
AnchorMinimumMeters = 350
; Clamped to population radius: current effective maximum is 600m.
; 生成範囲で補正されるため、この設定での実効最大は600m。
AnchorMaximumMeters = 700
MinimumAnchorSpeedKmh = 3.6
MinimumHeadingDot = 0.25
IntervalSeconds = 5.0

[Diagnostics]
TelemetryIntervalSeconds = 5.0

