; MW Native Free Roam Racer - v0.1.3
; Edit while the game is closed, then restart. / ゲーム終了中に編集し、再起動してください。
; 1 = ON / 有効, 0 = OFF / 無効. Use a decimal point (1.25), not a comma.
; Release defaults based on Main / Main環境の確認済み設定: 2026-10-25
;
; QUICK SETTINGS / よく使う設定
; Language: [Encounter] Language = ja (日本語) / en (English)
; AI mode:  [Encounter] AIMode = Custom AI / Stable
; Car count: [Population] MaximumRacers (1..15)
; Keep the key/section names unchanged. / 項目名・セクション名は変更しないでください。

; ======================================================================
; 1. ENCOUNTER BATTLES / エンカウンターバトル
; ======================================================================
[Encounter]

; MESSAGE LANGUAGE / メッセージ言語
; ja = 日本語 / Japanese
; en = English / 英語
; Changes battle text only; not the game language or voice files.
; バトルの表示文だけを変更。ゲーム本体の言語・音声ファイルは変更しません。
Language = ja

; Battle availability. 0 leaves roaming racers enabled.
; バトル機能。0でもレーサーのフリーローム走行は維持します。
SignalEnabled = 1

; Maximum absolute speed difference to challenge (km/h): 0..100.
; 開始時に許容する速度差。10なら相手より±10km/h以内。0は速度一致。
; Also checked on button press. Edit with game closed, then restart.
; ボタンを押した瞬間にも判定。ゲーム終了中に編集し、再起動してください。
StartSpeedToleranceKmh = 15

; Custom AI = directional trail follow + overtaking attack within 15 m.
; Stable = original stable mode, without Custom AI trajectory control.
; Custom AI = 軌跡方向を追走し、15m以内で追い抜き（向きなどの条件あり）。
; Stable = 従来の安定版。Custom AIの軌跡制御は使いません。
; Reward / 報酬: Custom AI = BL15:300 .. BL1:3000 / Stable = 1000 fixed / 固定
AIMode = Custom AI

; OPTIONAL WIN-STREAK WAGER / 任意の連勝ボーナス付き賭けバトル (Custom AI only)
; 0 = original rewards, 1 = wager. Stable mode always ignores this switch.
; First battle x1.00, then +5% of the BL base reward per previous win (not compound).
; No rounding or multiplier cap. Lose/weapon-forfeit: pay the same amount.
; Stake is fixed at start. Insufficient cash or native cash overflow blocks start.
; Losing or leaving free roam (safehouse/shop/event) resets the streak; pause does not.
; 0=従来報酬、1=賭け有効。初戦1倍、以降1勝ごとに基本報酬の5%を加算。
; 端数切捨て・倍率上限なし。敗北・反則負けで開始時の報酬額と同額を失います。
; 残高不足・所持金の表現限界では開始不可。敗北・フリーローム離脱で連勝リセット。
; ゲーム終了中に変更し再起動。既定OFF / Default OFF; restart required.
WinStreakWager = 0

; AI LEADING / AI先導時 (Custom AI only / 専用)
; Drive-output multiplier, range 1.00..2.00. 1.00 disables this boost.
; 駆動出力倍率1.00～2.00。1.00で補正なし。速度・最高速の倍率ではありません。
CustomAILeaderPowerScale = 1.25

; AI TRAILING / AI追走時 (both modes / 両モード)
; Drive-output multipliers, range 1.00..2.00; not speed multipliers.
; 距離別の駆動出力倍率1.00～2.00。速度倍率ではありません。
; 0..100 m / 0～100m
PowerScale0To100 = 1.50
; Over 100..200 m / 100m超～200m
PowerScale100To200 = 1.75
; Over 200..300 m / 200m超～300m
PowerScale200To300 = 2.00

; ======================================================================
; 2. RACER POPULATION / レーサー生成
; ======================================================================
[Population]
; Experimental, restart required. Reuse completed appearance for up to 15s (OFF: 5s).
; Career, anchor and capacity are still checked fresh. No LB required or held reservation.
; 実験機能・再起動必須。完成済み外見の保持を最大15秒へ延長（0=従来5秒）。
; キャリア・アンカー・空き枠は生成前に再検査。LB不要・予約延長なし。
RetainPreparedAppearance = 1
; Experimental: briefly defer NEW spawn preparation after >=50ms driving frames.
; After 2 seconds, next due check resumes normal guards. Existing AI unchanged.
; 実験機能・再起動必須。新規生成準備のみ短時間延期。LB不要。0=従来動作。
AdaptiveSpawnPacing = 1
; Master roaming-racer switch. / レーサー生成機能のON/OFF。
Enabled = 1
; Maximum cars: 1..15. Resource/traffic limits may reduce the actual count.
; 最大台数1～15。資源・交通アンカーの状況で実数は減る場合があります。
MaximumRacers = 6
; Normal cruising target speed: percentage of native AI request, 1..100.
; 通常巡航の目標速度を純正AIの要求速度に対する割合(％)で制限。範囲1～100。
; 60 = 60 percent, NOT 60 km/h. 100 disables the reduction.
; 60は60km/h固定ではありません。100で制限なし。
; Battle opponent and police-pursued racers are exempt; both AI modes.
; バトル相手・警察追跡中のレーサーは対象外。両AIモード対応。
CruisingSpeedPercent = 60
; Management radius from player: 100..1000 metres. / 管理半径100～1000m。
RadiusMeters = 600

; ======================================================================
; 3. MINIMAP / ミニマップ
; ======================================================================
[Markers]
; Display radius: 25 m .. population radius. / 表示半径25m～管理半径。
RadiusMeters = 200

; ======================================================================
; 4. VEHICLE VARIETY & APPEARANCE / 車種・外見
; ======================================================================
[Vehicles]
; 1..5 model types INCLUDING your car; not the total car count.
; 自車を含む1～5車種。台数とは別。価格・性能が近い車種を選別。
Variety = 5
; Random paint/body/hood/spoiler; wheels remain stock.
; 塗装・ボディ・フード・スポイラーを抽選。ホイールは純正。
RandomAppearance = 1
; Invalid-part retries: 1..5, then fall back to stock.
; 不正パーツの再抽選回数1～5。上限後は純正へ戻します。
AppearanceAttempts = 3

; ======================================================================
; 5. AUDIO / 音声
; ======================================================================
[Audio]
; Free-roam engine audio slots: 0..4. Does not expand the native audio pool.
; フリーロームのエンジン音枠0～4。ゲーム本体の音声プールは拡張しません。
; Encounter voices follow in-game voice volume. / バトル音声の音量はゲーム設定に追従。
FreeRoamSlots = 4

; ======================================================================
; 5B. OPTIONAL LIMIT BREAKER FEATURES / 任意LB連携・LBが必要な拡張
; ======================================================================
[LimitBreaker]
; NFRR works without LB. These extensions require a compatible capability API,
; not a particular LB release. Missing/disabled/unsupported LB uses the normal path.
; LBなしでもNFRRは動作します。版番号ではなく対応API・能力・実容量で判定。
; LBなし・無効・非対応なら通常動作。生成枠の連携は対応API検出時に自動利用。
; Old [Audio] LBEngineAudioExpansion is accepted only if this key is absent.
; 旧[Audio]内の同名設定は、この項目がない場合のみ読み込みます。
; Experimental, restart required. 0 = existing 0-4 slots (default).
; 1 = request 6 free-roam engine slots only with LB's verified >=8 MiB audio arena.
; Missing/incompatible LB falls back to FreeRoamSlots. FreeRoamSlots=0 still disables support.
; 実験機能・再起動必須。1=LBの音声領域8MiB以上を確認した場合のみ6枠を要求。
; LBなし・能力不足では従来枠へ戻ります。走行中の切替・車種設定の変更はしません。
; 音切れが出たら0に戻してください。
LBEngineAudioExpansion = 1
; Experimental, restart required. 1 requests SIX model types including the player,
; replacing [Vehicles] Variety only with verified LB audio and six allocated slots.
; Otherwise [Vehicles] Variety (1..5) applies. Racer/audio slot counts are unchanged.
; 実験機能・再起動必須。対応LB音声と実6枠を確認できた場合のみ、自車込み6車種。
; 条件不足なら[Vehicles] Varietyの1～5車種。0で従来動作に戻ります。
LBVehicleVarietyExpansion = 1
; Experimental, restart required. Non-NFRR share of LB total capacity (0=off, 1..64).
; Shared by player/traffic/police/other MODs, not extra leases or guaranteed empties.
; Also preserves the last two moving ordinary traffic cars from MOD retirement.
; 実験機能・再起動必須。LB総上限のうちNFRR以外に残す枠。0=従来動作。
; 自車・交通・警察・他MODの共用枠。空きや警察出現の保証ではありません。LBなしでは無効。
LBNonRacerSlots = 6

; ======================================================================
; 6. BACKGROUND POLICE / 背景の警察追跡
; ======================================================================
[BackgroundPolice]
; Native patrol detection of racers.
; 巡回警察によるレーサー発見。
Enabled = 1

; ======================================================================
; 7. ADVANCED SPAWNING / 生成の詳細設定
; ======================================================================
[Spawning]
; Traffic supplies positions only; generated opponents use racer AI.
; アザーカーは生成位置の基準だけに使用。相手はレーサーAIで走行。
; Anchor distance in metres. Maximum is clamped to the population radius.
; アンカー距離(m)。最大距離は管理半径で制限（現在の実効最大600m）。
AnchorMinimumMeters = 350
AnchorMaximumMeters = 700
; Minimum traffic speed (km/h). / アンカー車両の最低速度(km/h)。
MinimumAnchorSpeedKmh = 3.6
; Heading alignment: larger values prefer a closer direction.
; 進行方向の一致度。大きい値ほど近い向きを優先します。
MinimumHeadingDot = 0.25
; Spawn interval in seconds. / 生成間隔（秒）。
IntervalSeconds = 5.0

; ======================================================================
; 8. DIAGNOSTICS / 診断ログ
; ======================================================================
[Diagnostics]
Logging=0
; Restart required. Deep audio observers are expensive; enable only for investigation.
; 再起動必須。詳細音声トレースは高負荷のため、調査時のみ1にしてください。
; Does not disable engine sounds, pool support, or optional LB integration.
; エンジン音・音声枠・任意LB連携の動作は変えません。
DeepAudioDiagnostics = 0
; Lightweight timing histograms every 30 seconds. 0 disables timing entirely.
; 軽量な処理時間分布を30秒ごとに記録。0で計測停止。LBなしでも利用可。
FrameTiming = 0
; Telemetry interval in seconds. / 状態ログの出力間隔（秒）。
TelemetryIntervalSeconds = 5.0

; ======================================================================
; 9. STARTUP UPDATE NOTICE / 起動時の更新通知
; ======================================================================
[Updates]
; Checks public GitHub metadata once at launch. No download or installation.
; 起動時にGitHub公開情報を確認。DL・インストールは行いません。
; 0 disables both network access and notification. Offline/errors do not block play.
; 0で通信・通知とも無効。オフラインや通信エラー時もゲームを続行します。
Enabled = 1
; auto follows [Encounter] Language; game language is fallback if absent.
; autoは[Encounter] Languageに連動。未指定時のみゲーム側設定を参照。
; ja = Japanese; en and all other/unknown languages = English.
; jaで日本語。en・その他・判定不能時は英語。
Language = auto
